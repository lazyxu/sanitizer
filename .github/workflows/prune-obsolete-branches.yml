name: Prune verified obsolete branches
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/prune-obsolete-branches.yml'
permissions:
  contents: write
  pull-requests: read
jobs:
  prune:
    if: github.repository == 'lazyxu/sanitizer'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified inactive branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          api = "https://api.github.com/repos/" + repo
          token = os.environ["GH_TOKEN"]
          targets = [["fix/memcheck-doc-audit-20261105","72cc3262314c429d472e921643321dc391a53d57",23],["docs/memcheck-b1-b2-b3-implementation","f0bd658e629276c756b0474d8d6178d5fe8e7324",22],["docs/meeting-review-rewrite-20261102","d59c7113f65cb8221bdd0b366114162696cb6134",21],["docs/final-links-status-audit-v28-20261023","f04b47bc7884babf97b39dcb692760b0adddfead",19],["docs/architecture-canonicalization-v27","e7426e6f6b8d0bae48af7b216676d680505127e8",17],["docs/vendor-evidence-normalization-v26","d810636fc90f30e4729b1c4d8a5a0130df5f0014",16],["docs/amd-xnack-component-dedup-v25","79db7af6d18f74263064337f2b7619dc4d5ff96d",15],["docs/s01-implementation-dedup-v24","593e9ffa7d6a6f774e36dd4fea7cb31338b1a913",14],["docs/scenario-ch18-single-source-20261023","891ab65d691fda4098369e2b47f8348947d095d9",13],["docs/intel-audit-v22-20261023","7d1ad88e84176a3e464a6a657cadb39eaccc6cf5",12],["docs/xnack-shadow-mapping-tradeoffs","f8e9cbe344b9748eebab92602724103e527215b9",10],["feat/verbose-all-scripts","b9462a3936af0c88d70bec39b40ea613a20749d8",9],["feat/nvidia-upstream-regression","f79813eda732f0743bb367f0121d939b52d8bffb",8],["docs/slim-research-ch18-case-single-source","7a15648d4fdc4eaa676b09a3cd846efdf59a9ba2",None]]
          def request(path, method="GET"):
              req = urllib.request.Request(api + path, method=method, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      data = r.read()
                      return json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  if method == "GET" and exc.code == 404:
                      return None
                  raise
          open_prs = request("/pulls?state=open&per_page=100")
          if len(open_prs) == 100:
              raise RuntimeError("Open PR list may be truncated: fail closed")
          open_heads = {p["head"]["ref"] for p in open_prs if p["head"]["repo"] and p["head"]["repo"]["full_name"] == repo}
          for name, expected_sha, pr_number in targets:
              if name in open_heads or name == "master":
                  print("SKIP active/protected:", name)
                  continue
              path = "/branches/" + urllib.parse.quote(name, safe="/")
              branch = request(path)
              if branch is None:
                  print("ALREADY DELETED:", name)
                  continue
              if branch["protected"] or branch["commit"]["sha"] != expected_sha:
                  print("SKIP protected or advanced branch:", name)
                  continue
              if pr_number is not None:
                  pr = request("/pulls/" + str(pr_number))
                  if not pr or not pr["merged_at"] or pr["state"] != "closed" or pr["head"]["ref"] != name:
                      print("SKIP PR not merged:", name)
                      continue
              else:
                  comparison = request("/compare/master..." + urllib.parse.quote(name, safe=""))
                  if not comparison or comparison["ahead_by"] != 0:
                      print("SKIP branch with unique commits:", name)
                      continue
              request("/git/refs/heads/" + urllib.parse.quote(name, safe="/"), "DELETE")
              print("DELETED:", name)
          # Explicitly retired closed PR branches, with a merged replacement PR.
          retired_closed_pr_branches = [
              ["docs/architecture-single-source-v27", "0e64cb564e67e05a6173d2762453bf1bd89c71c9", 18, 17],
              ["docs/software-memcheck-alternatives-matrix-20261102", "4696170c074ff9b1514d4758b05620031d1f890a", 20, 21],
          ]
          for name, expected_sha, old_pr_number, replacement_pr_number in retired_closed_pr_branches:
              if name in open_heads or name == "master":
                  print("SKIP active branch:", name)
                  continue
              branch = request("/branches/" + urllib.parse.quote(name, safe="/"))
              if not branch:
                  print("ALREADY DELETED:", name)
                  continue
              if branch["protected"] or branch["commit"]["sha"] != expected_sha:
                  print("SKIP protected or advanced branch:", name)
                  continue
              old_pr = request("/pulls/" + str(old_pr_number))
              replacement_pr = request("/pulls/" + str(replacement_pr_number))
              supersession_evidence = (
                  old_pr and replacement_pr and (
                      f"#{replacement_pr_number}" in (old_pr.get("body") or "")
                      or f"#{old_pr_number}" in (replacement_pr.get("body") or "")
                  )
              )
              if (not old_pr or old_pr["state"] != "closed" or old_pr["merged_at"] is not None
                      or old_pr["head"]["ref"] != name or old_pr["head"]["sha"] != expected_sha
                      or not replacement_pr or replacement_pr["state"] != "closed" or not replacement_pr["merged_at"]
                      or replacement_pr["base"]["ref"] != "master"
                      or not supersession_evidence):
                  print("SKIP without merged superseding PR evidence:", name)
                  continue
              request("/git/refs/heads/" + urllib.parse.quote(name, safe="/"), "DELETE")
              print("DELETED superseded closed PR branch:", name)

          # This post-merge branch contains only an obsolete v2.2 audit snapshot.
          # Delete only if its exact one-commit delta is still based on merged PR #11
          # and master now carries a strictly newer validation-report version.
          stale_post_merge_branches = [
              ["docs/intel-sanitizers-navigation-20261023", "5e40225e51028c482716a26ec60d3032e95bb0a0", 11, "a5f87e8cb5f2de2da19401063646ff9cb7a6e98f"],
          ]
          def read_validation_report(ref):
              encoded = request("/contents/docs/validation-report.json?ref=" + urllib.parse.quote(ref, safe=""))
              if not encoded or encoded.get("encoding") != "base64":
                  return None
              return json.loads(base64.b64decode(encoded["content"]).decode("utf-8"))
          def version_tuple(value):
              return tuple(int(part) for part in str(value).split("."))
          for name, expected_sha, merged_pr_number, expected_parent_sha in stale_post_merge_branches:
              if name in open_heads or name == "master":
                  print("SKIP active branch:", name)
                  continue
              branch = request("/branches/" + urllib.parse.quote(name, safe="/"))
              if not branch:
                  print("ALREADY DELETED:", name)
                  continue
              if branch["protected"] or branch["commit"]["sha"] != expected_sha:
                  print("SKIP protected or advanced branch:", name)
                  continue
              merged_pr = request("/pulls/" + str(merged_pr_number))
              commit = request("/commits/" + expected_sha)
              changed_files = [item["filename"] for item in (commit or {}).get("files", [])]
              parents = [item["sha"] for item in (commit or {}).get("parents", [])]
              old_report = read_validation_report(name)
              current_report = read_validation_report("master")
              if (not merged_pr or merged_pr["state"] != "closed" or not merged_pr["merged_at"]
                      or merged_pr["head"]["ref"] != name or merged_pr["head"]["sha"] != expected_parent_sha
                      or not commit or parents != [expected_parent_sha]
                      or changed_files != ["docs/validation-report.json"]
                      or not old_report or not current_report
                      or version_tuple(current_report["version"]) <= version_tuple(old_report["version"])):
                  print("SKIP stale snapshot guard did not match:", name)
                  continue
              request("/git/refs/heads/" + urllib.parse.quote(name, safe="/"), "DELETE")
              print("DELETED obsolete post-merge snapshot branch:", name)

          # Clean up merged PR branches only if their refs never moved.
          recent = request("/pulls?state=closed&per_page=100")
          if len(recent) == 100:
              raise RuntimeError("Closed PR list may be truncated: fail closed")
          for pr in recent:
              name = pr["head"]["ref"]
              if (name in open_heads or name == "master"
                      or not pr["merged_at"] or not pr["head"].get("repo")
                      or pr["head"]["repo"]["full_name"] != repo):
                  continue
              branch = request("/branches/" + urllib.parse.quote(name, safe="/"))
              if not branch or branch["protected"] or branch["commit"]["sha"] != pr["head"]["sha"]:
                  continue
              request("/git/refs/heads/" + urllib.parse.quote(name, safe="/"), "DELETE")
              print("DELETED merged PR branch:", name)
          PY
