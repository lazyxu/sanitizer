name: One-time merged GPU sanitizer taxonomy branch cleanup
on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/prune-merged-core-design-v2-once.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune-exact-merged-branch:
    if: github.repository == 'lazyxu/sanitizer' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check merged PR head SHA, delete and verify
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const branch = "docs/three-core-designs-v2-20261022";
            const sha = "0b7391946d0cc409e7e1d97991a68f832ce1598d";
            const {data: pr} = await github.rest.pulls.get({owner,repo,pull_number:6});
            if (!pr.merged_at || pr.state !== "closed" ||
                pr.head.ref !== branch || pr.head.sha !== sha ||
                pr.head.repo?.full_name !== owner + "/" + repo) {
              throw Error("PR #6 merge/head not verified");
            }
            const ref = "heads/" + branch;
            try {
              const result = await github.rest.git.getRef({owner,repo,ref});
              if (result.data.object.sha !== sha) throw Error("Branch HEAD changed");
            } catch (err) {
              if (err.status === 404) {core.info("Branch already absent"); return;}
              throw err;
            }
            await github.rest.git.deleteRef({owner,repo,ref});
            try {
              await github.rest.git.getRef({owner,repo,ref});
              throw Error("Branch still exists after deletion");
            } catch(err) {
              if (err.status !== 404) throw err;
            }
            core.info("Deleted exact merged branch " + branch);
